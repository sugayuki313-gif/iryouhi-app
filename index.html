<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高額療養費 自己負担上限額 算定ツール</title>
  <style>
    :root {
      --primary-color: #1b5e20;
      --primary-light: #e8f5e9;
      --border-color: #ccc;
      --text-color: #333;
      --bg-color: #f9f9f9;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-top: 0;
    }

    .info-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .radio-group {
      display: flex;
      gap: 16px;
    }

    .radio-group label {
      font-weight: normal;
      cursor: pointer;
    }

    button {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #144617;
    }

    .result-card {
      margin-top: 24px;
      padding: 20px;
      background-color: #f0f7f0;
      border: 2px solid var(--primary-color);
      border-radius: 6px;
      display: none;
    }

    .result-card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--primary-color);
    }

    .amount-display {
      font-size: 2rem;
      font-weight: bold;
      color: #d32f2f;
      margin: 8px 0;
    }

    .notes {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #666;
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
    }

    .notes ul {
      padding-left: 20px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>高額療養費 自己負担上限額 算定ツール</h1>
  <div class="info-badge" id="applied-version-badge">制度基準：確認中...</div>

  <form id="calcForm">
    <!-- 年齢区分 -->
    <div class="form-group">
      <label for="ageCategory">対象者の区分（年齢）</label>
      <select id="ageCategory" onchange="updateCategoryOptions()">
        <option value="under70">69歳以下</option>
        <option value="over70" selected>70歳以上</option>
      </select>
    </div>

    <!-- 所得区分 -->
    <div class="form-group">
      <label for="incomeCategory">所得区分</label>
      <select id="incomeCategory">
        <!-- JSで動的に設定 -->
      </select>
    </div>

    <!-- 診療区分（入院/外来） -->
    <div class="form-group">
      <label>診療区分</label>
      <div class="radio-group">
        <label><input type="radio" name="treatmentType" value="inpatient" checked> 入院（世帯合算）</label>
        <label><input type="radio" name="treatmentType" value="outpatient"> 外来（個人単位）</label>
      </div>
    </div>

    <!-- 10割総医療費 -->
    <div class="form-group">
      <label for="medicalCost">医療費総額（10割・窓口支払前額） [円]</label>
      <input type="number" id="medicalCost" placeholder="例: 1000000" min="0" step="10" required>
    </div>

    <!-- 多数回該当 -->
    <div class="form-group">
      <label for="multipleApp">多数回該当（過去12ヶ月で4か月目以降か）</label>
      <select id="multipleApp">
        <option value="1">該当しない（通常）</option>
        <option value="3">該当する（多数回該当）</option>
      </select>
    </div>

    <button type="button" onclick="handleCalculate()">上限額を計算する</button>
  </form>

  <!-- 計算結果エリア -->
  <div class="result-card" id="resultCard">
    <h2>概算自己負担上限額</h2>
    <div class="amount-display" id="resultAmount">0 円</div>
    <div id="subNote" style="font-weight: bold; color: #333;"></div>

    <div class="notes">
      <strong>【ご案内・注意事項】</strong>
      <ul id="disclaimerList">
        <!-- JSで動的挿入 -->
      </ul>
    </div>
  </div>
</div>

<script>
/* =========================================================
   高額療養費計算ロジック（厚生労働省ガイドライン準拠）
   適用基準: 平成30年8月診療分以降（2026年8月現在適用中）
========================================================= */

const HIGH_MEDICAL_CARE_CONFIG = {
  versionInfo: "厚生労働省 平成30年8月改定基準（2026年8月現在適用）",
  disclaimers: [
    "本計算結果は単一の医療機関・レセプトにおける概算です。",
    "入院時の食事代、差額ベッド代、先進医療費用等は含みません。",
    "世帯合算や多数回該当の正確な判定・適用はご加入の医療保険者（協会けんぽ、市町村国保等）による確認が必要です。"
  ]
};

// 選択肢の動的生成データ
const CATEGORY_OPTIONS = {
  under70: [
    { value: "top", label: "区分ア（年収約1,160万円〜 / 健保標報83万円以上）" },
    { value: "high", label: "区分イ（年収約770万〜約1,160万円 / 健保標報53万〜79万円）" },
    { value: "middle", label: "区分ウ（年収約370万〜約770万円 / 健保標報28万〜50万円）" },
    { value: "low", label: "区分エ（〜年収約370万円 / 健保標報26万円以下）" },
    { value: "nonTax", label: "区分オ（住民税非課税者）" }
  ],
  over70: [
    { value: "top", label: "現役並みⅢ（年収約1,160万円〜 / 課税所得690万円以上）" },
    { value: "high_ii", label: "現役並みⅡ（年収約770万〜約1,160万円 / 課税所得380万円以上）" },
    { value: "high_i", label: "現役並みⅠ（年収約370万〜約770万円 / 課税所得145万円以上）" },
    { value: "middle", label: "一般（年収約156万〜約370万円 / 課税所得145万円未満等）" },
    { value: "low_ii", label: "低所得Ⅱ（住民税非課税世帯）" },
    { value: "low_i", label: "低所得Ⅰ（住民税非課税・年金収入80万円以下等）" }
  ]
};

// 初期表示処理
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("applied-version-badge").innerText = "制度基準：" + HIGH_MEDICAL_CARE_CONFIG.versionInfo;
  updateCategoryOptions();
});

// 年齢区分に応じた所得区分の切り替え
function updateCategoryOptions() {
  const ageCategory = document.getElementById("ageCategory").value;
  const selectElement = document.getElementById("incomeCategory");
  selectElement.innerHTML = "";

  CATEGORY_OPTIONS[ageCategory].forEach(opt => {
    const option = document.createElement("option");
    option.value = opt.value;
    option.textContent = opt.label;
    selectElement.appendChild(option);
  });
}

// 主計算関数
function calculateCorrectCap(ageCategory, category, cost, treatmentType, multiple) {
  let cap = 0;
  let multipleCap = null;
  let subNote = "";

  if (ageCategory === "under70") {
    switch (category) {
      case "top":
        cap = 252600 + Math.max(0, cost - 842000) * 0.01;
        multipleCap = 140100;
        break;
      case "high":
        cap = 167400 + Math.max(0, cost - 558000) * 0.01;
        multipleCap = 93000;
        break;
      case "middle":
        cap = 80100 + Math.max(0, cost - 267000) * 0.01;
        multipleCap = 44400;
        break;
      case "low":
        cap = 57600;
        multipleCap = 44400;
        break;
      case "nonTax":
        cap = 35400;
        multipleCap = 24600;
        break;
    }
  } else {
    // 70歳以上
    switch (category) {
      case "top":
        cap = 252600 + Math.max(0, cost - 842000) * 0.01;
        multipleCap = 140100;
        break;
      case "high_ii":
        cap = 167400 + Math.max(0, cost - 558000) * 0.01;
        multipleCap = 93000;
        break;
      case "high_i":
        cap = 80100 + Math.max(0, cost - 267000) * 0.01;
        multipleCap = 44400;
        break;
      case "middle":
        if (treatmentType === "outpatient") {
          cap = 18000;
          subNote = "※70歳以上・一般区分の外来個人上限は年間（8月〜翌7月）14万4,000円です。";
        } else {
          cap = 57600;
          multipleCap = 44400;
        }
        break;
      case "low_ii":
        cap = (treatmentType === "outpatient") ? 8000 : 24600;
        break;
      case "low_i":
        cap = (treatmentType === "outpatient") ? 8000 : 15000;
        break;
    }
  }

  // 多数回該当の計算
  if (multiple === "3" && multipleCap !== null) {
    cap = Math.min(cap, multipleCap);
  }

  return {
    amount: Math.floor(cap),
    subNote: subNote
  };
}

// フォーム送信時のハンドラ
function handleCalculate() {
  const ageCategory = document.getElementById("ageCategory").value;
  const category = document.getElementById("incomeCategory").value;
  const cost = Number(document.getElementById("medicalCost").value);
  const treatmentType = document.querySelector('input[name="treatmentType"]:checked').value;
  const multiple = document.getElementById("multipleApp").value;

  if (isNaN(cost) || cost <= 0) {
    alert("正しく医療費総額（10割）を入力してください。");
    return;
  }

  const result = calculateCorrectCap(ageCategory, category, cost, treatmentType, multiple);

  // 画面表示処理
  document.getElementById("resultAmount").innerText = result.amount.toLocaleString() + " 円";
  document.getElementById("subNote").innerText = result.subNote;

  // 免責事項の出力
  const disclaimerList = document.getElementById("disclaimerList");
  disclaimerList.innerHTML = "";
  HIGH_MEDICAL_CARE_CONFIG.disclaimers.forEach(text => {
    const li = document.createElement("li");
    li.innerText = text;
    disclaimerList.appendChild(li);
  });

  document.getElementById("resultCard").style.display = "block";
}
</script>

</body>
</html>
